services:
  curator:
    image: ghcr.io/runkaiz/curatorr:latest
    container_name: curatorr
    ports:
      - "3000:3000"
    volumes:
      - /mnt/user/appdata/curatorr/data:/data
    environment:
      - DATABASE_URL=/data/curator.db
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_PERMANENT_COLLECTION_SYNC=${PLEX_PERMANENT_COLLECTION_SYNC:-false}
      - PLEX_PERMANENT_COLLECTION_NAME=${PLEX_PERMANENT_COLLECTION_NAME:-Permanent Exhibition}
      - MAINTENANCE_TOKEN=${MAINTENANCE_TOKEN:-}
      - TAUTULLI_URL=${TAUTULLI_URL}
      - TAUTULLI_API_KEY=${TAUTULLI_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
    restart: unless-stopped
